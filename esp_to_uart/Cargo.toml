
[package]
edition      = "2024"
name         = "esp_to_uart"
rust-version = "1.95"
version      = "0.1.0"
autobins     = false

[[bin]]
name = "esp_to_uart"
path = "./src/bin/main.rs"

[dependencies]

# ESP32 HAL
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

# ESP RTOS
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

# Bootloader
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }

# Logging
log = "0.4.27"
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

# Networking
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "multicast",
  "tcp",
  "udp",
] }

smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

# Async I/O
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.0", features = ["log"] }

# ESP Wi-Fi
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }

# Memory
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
static_cell = "2.1.1"
critical-section = "1.2.0"

# Backtrace
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }

# OLED display
embedded-graphics = "0.8.1"
ssd1306 = { version = "0.10.0", features = ["graphics"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
